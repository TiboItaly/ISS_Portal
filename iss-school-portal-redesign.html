<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISS — Portale Scuola-Famiglia</title>
<style>
  :root {
    --ink: #16232e;
    --ink-soft: #5c6b78;
    --paper: #f4f6f8;
    --card: #ffffff;
    --brand: #0e7c86;
    --brand-deep: #0a5560;
    --brand-tint: #e6f3f4;
    --accent: #e8734a;
    --accent-tint: #fdEEE7;
    --line: #e4e9ee;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(22,35,46,.05), 0 8px 24px rgba(22,35,46,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-inner {
    max-width: 1240px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-deep));
    color: #fff; font-weight: 700; font-size: .95rem;
    display: grid; place-items: center; letter-spacing: .5px;
  }
  .brand-name { font-weight: 700; font-size: 1.05rem; }
  .brand-sub { font-size: .78rem; color: var(--ink-soft); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .grade-picker { display: flex; align-items: center; gap: 8px; }
  .grade-picker label { font-size: .85rem; font-weight: 600; color: var(--ink-soft); }
  .grade-picker select {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); font-size: .9rem; cursor: pointer; color: var(--ink);
    transition: border-color .2s;
  }
  .grade-picker select:hover, .grade-picker select:focus { border-color: var(--brand); outline: none; }
  .lang-group { display: flex; gap: 4px; background: var(--paper); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
  .lang-btn {
    border: none; background: transparent; padding: 5px 11px; border-radius: 999px;
    cursor: pointer; font-size: .95rem; transition: all .2s; opacity: .55;
  }
  .lang-btn:hover { opacity: 1; }
  .lang-btn.active { background: var(--card); opacity: 1; box-shadow: var(--shadow); }

  /* ---------- Welcome banner ---------- */
  .welcome-banner {
    background: linear-gradient(90deg, var(--brand-tint), var(--accent-tint));
    border-bottom: 1px solid var(--line);
    padding: 10px 24px; display: flex; align-items: center; gap: 10px;
    font-size: .9rem; font-weight: 600; color: var(--brand-deep);
  }
  .welcome-banner .welcome-icon { font-size: 1.1rem; }
  .welcome-banner #t-welcome { flex: 1; text-align: center; }
  .welcome-close {
    border: none; background: transparent; color: var(--ink-soft);
    font-size: 1.1rem; cursor: pointer; padding: 2px 8px; border-radius: 6px; line-height: 1;
  }
  .welcome-close:hover { background: rgba(22,35,46,.08); color: var(--ink); }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1240px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: 300px 1fr 320px; gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--line);
    padding: 20px;
  }
  .card h2 {
    font-size: 1rem; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  }
  .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .section-label {
    font-size: .72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: var(--ink-soft); margin: 18px 0 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .badge {
    background: var(--accent-tint); color: var(--accent);
    font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .badge.brand { background: var(--brand-tint); color: var(--brand); }

  /* ---------- Lists ---------- */
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 10px; cursor: pointer;
    transition: background .15s, transform .15s; border: 1px solid transparent;
    margin-bottom: 6px;
  }
  .item:hover { background: var(--paper); transform: translateX(3px); }
  .item .icon {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: 1rem;
    background: var(--brand-tint);
  }
  .item.alert .icon { background: var(--accent-tint); }
  .item .title { font-size: .88rem; font-weight: 600; }
  .item.alert .title::after {
    content: ''; display: inline-block; width: 7px; height: 7px;
    background: var(--accent); border-radius: 50%; margin-left: 7px; vertical-align: middle;
  }
  .item .date { font-size: .75rem; color: var(--ink-soft); }
  .add-btn {
    width: 100%; margin-top: 8px; padding: 9px; border-radius: 10px;
    border: 1px dashed var(--line); background: transparent; color: var(--ink-soft);
    font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .add-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-tint); }

  /* ---------- Weekly schedule ---------- */
  .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .day-col {
    background: var(--paper); border-radius: 12px; padding: 12px;
    border: 1px solid var(--line); min-height: 160px;
  }
  .day-col .day-name {
    font-size: .78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--brand); text-align: center;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .lesson {
    background: var(--card); border-radius: 8px; padding: 9px 10px;
    margin-bottom: 6px; border: 1px solid var(--line);
    border-left: 3px solid var(--brand);
    font-size: .8rem; font-weight: 600;
    display: flex; flex-direction: column; gap: 2px;
  }
  .lesson:nth-child(4n+2) { border-left-color: var(--accent); }
  .lesson:nth-child(4n+3) { border-left-color: #7a9d54; }
  .lesson:nth-child(4n+4) { border-left-color: #b06ab3; }
  .lesson .time { font-size: .7rem; font-weight: 500; color: var(--ink-soft); }
  .empty-state {
    text-align: center; color: var(--ink-soft); padding: 48px 20px; font-size: .92rem;
  }
  .empty-state .big { font-size: 2rem; margin-bottom: 10px; }

  /* ---------- Monthly calendar ---------- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav .month-name { font-weight: 700; font-size: .95rem; }
  .cal-nav button {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-size: .9rem; color: var(--ink);
    transition: all .2s;
  }
  .cal-nav button:hover { background: var(--brand-tint); border-color: var(--brand); color: var(--brand); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { text-align: center; font-size: .68rem; font-weight: 700; color: var(--ink-soft); padding: 6px 0; text-transform: uppercase; letter-spacing: .5px; }
  .cal-cell {
    aspect-ratio: 1; display: grid; place-items: center; border-radius: 9px;
    font-size: .8rem; cursor: pointer; position: relative; transition: background .15s;
    border: 1px solid transparent;
  }
  .cal-cell:hover { background: var(--brand-tint); }
  .cal-cell.dim { color: #c3ccd4; }
  .cal-cell.today { background: var(--brand); color: #fff; font-weight: 700; }
  .cal-cell.today:hover { background: var(--brand-deep); }
  .cal-cell.event::after {
    content: ''; position: absolute; bottom: 5px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent);
  }
  .cal-cell.today.event::after { background: #fff; }

  .event-row {
    display: flex; gap: 10px; padding: 10px; border-radius: 10px;
    background: var(--paper); margin-bottom: 8px; align-items: flex-start;
    border: 1px solid var(--line);
  }
  .event-row .bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--brand); flex: none; }
  .event-row:nth-child(2) .bar { background: var(--accent); }
  .event-row:nth-child(3) .bar { background: #7a9d54; }
  .event-row strong { font-size: .85rem; display: block; }
  .event-row .date { font-size: .74rem; color: var(--ink-soft); }

  footer {
    text-align: center; padding: 24px; color: var(--ink-soft); font-size: .78rem;
  }

  .menu-day {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 8px;
  }
  .menu-day .menu-day-name {
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--brand); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .menu-day .dish {
    font-size: .82rem; padding: 6px 10px; margin-bottom: 4px;
    background: var(--card); border-radius: 7px; border: 1px solid var(--line);
  }
  .menu-day .dish::before { content: '🍽️ '; font-size: .75rem; }
  .week-cycle-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .cycle-tab {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); font-size: .78rem; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; transition: all .2s;
  }
  .cycle-tab:hover { border-color: var(--brand); color: var(--brand); }
  .cycle-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .cycle-label { font-size: .74rem; color: var(--ink-soft); margin-bottom: 12px; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr 1fr; }
    .layout > .card:first-child { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); padding-bottom: 90px; }
    .week-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar-inner { justify-content: center; gap: 10px; }
    .topbar { position: static; }
    .topbar-actions { width: 100%; justify-content: space-between; }
    .grade-picker { flex: 1; }
    .grade-picker select { flex: 1; }
    .lang-group { padding: 3px; }
    .lang-btn { padding: 5px 8px; }
    .cal-cell { font-size: .75rem; }
    .item { padding: 13px; }
    .item .title { font-size: .92rem; }
    .add-btn { padding: 12px; }
    footer { padding-bottom: 90px; }

    /* Bottom tab navigation */
    .tabbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 16px rgba(22,35,46,.08);
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: none; background: transparent; padding: 8px 4px; border-radius: 10px;
      font-size: .68rem; font-weight: 600; color: var(--ink-soft); cursor: pointer;
      min-height: 48px; justify-content: center;
    }
    .tab-btn .tab-icon { font-size: 1.25rem; line-height: 1; }
    .tab-btn.active { color: var(--brand); background: var(--brand-tint); }
    .layout .card.panel { display: none; }
    .layout .card.panel.active { display: block; }
  }
  @media (min-width: 701px) {
    .tabbar { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="welcome-banner" id="welcome-banner">
    <span class="welcome-icon">👋</span>
    <span id="t-welcome">Benvenuti nel sito di comunicazione dell'ISS</span>
    <button class="welcome-close" onclick="document.getElementById('welcome-banner').style.display='none'" aria-label="Chiudi">×</button>
  </div>
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">ISS</div>
      <div>
        <div class="brand-name" id="t-appTitle">Portale Scuola-Famiglia</div>
        <div class="brand-sub" id="t-schoolSub">Scuola Internazionale di Siena</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="grade-picker">
        <label for="grade-select" id="t-gradeLabel">Classe</label>
        <select id="grade-select"></select>
      </div>
      <div class="lang-group" id="lang-selector">
        <button class="lang-btn" data-lang="en" title="English"></button>
        <button class="lang-btn" data-lang="fr" title="Français"></button>
        <button class="lang-btn active" data-lang="it" title="Italiano"></button>
        <button class="lang-btn" data-lang="de" title="Deutsch"></button>
        <button class="lang-btn" data-lang="ru" title="Русский"></button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="card panel" id="panel-content">
    <h2><span class="dot"></span><span id="t-sidebarTitle">Contenuti</span></h2>

    <div class="section-label"><span id="t-docsTitle">Documenti importanti</span><span class="badge brand" id="doc-count">3</span></div>
    <div id="documents-container"></div>
    <button class="add-btn" id="add-doc-btn" onclick="addItem('doc')">+ <span id="t-addDoc">Aggiungi documento</span></button>

    <div class="section-label"><span id="t-commsTitle">Comunicazioni ricevute</span><span class="badge" id="comm-unread">2</span></div>
    <div id="communications-container"></div>
    <button class="add-btn" id="add-comm-btn" onclick="addItem('comm')">+ <span id="t-addComm">Aggiungi comunicazione</span></button>
  </aside>

  <main class="card panel" id="panel-weekly">
    <h2><span class="dot"></span><span id="t-weeklyTitle">Orario settimanale</span></h2>
    <div id="weekly-content"></div>
  </main>

  <aside class="card panel" id="panel-canteen">
    <h2><span class="dot"></span><span id="t-canteenTitle">Menu mensa</span></h2>
    <div class="week-cycle-tabs" id="cycle-tabs"></div>
    <div class="cycle-label" id="cycle-label"></div>
    <div id="canteen-content"></div>
  </aside>

  <aside class="card panel" id="panel-monthly">
    <h2><span class="dot"></span><span id="t-monthlyTitle">Calendario mensile</span></h2>
    <div class="cal-nav">
      <button onclick="moveMonth(-1)" aria-label="prev">‹</button>
      <span class="month-name" id="current-month"></span>
      <button onclick="moveMonth(1)" aria-label="next">›</button>
    </div>
    <div class="cal-grid" id="cal-heads"></div>
    <div class="cal-grid" id="cal-days"></div>

    <div class="section-label" style="margin-top:20px"><span id="t-eventsTitle">Eventi imminenti</span></div>
    <div id="upcoming-events"></div>
  </aside>
</div>

<footer id="t-footer">International School of Siena — Portale Scuola-Famiglia</footer>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-panel="panel-content"><span class="tab-icon">📋</span><span data-tab="content">Contenuti</span></button>
  <button class="tab-btn" data-panel="panel-weekly"><span class="tab-icon">🗓️</span><span data-tab="weekly">Orario</span></button>
  <button class="tab-btn" data-panel="panel-monthly"><span class="tab-icon">📅</span><span data-tab="monthly">Calendario</span></button>
  <button class="tab-btn" data-panel="panel-canteen"><span class="tab-icon">🍽️</span><span data-tab="canteen">Mensa</span></button>
</nav>

// ---------------- SVG flags ----------------
function flagSVG(code) {
  const w = 22, h = 16, r = 3;
  const wrap = inner => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-label="${code}"><defs><clipPath id="cp${code}"><rect x="0" y="0" width="${w}" height="${h}" rx="${r}"/></clipPath></defs><g clip-path="url(#cp${code})">${inner}</g><rect x="0.5" y="0.5" width="${w-1}" height="${h-1}" rx="${r}" fill="none" stroke="rgba(0,0,0,.15)"/></svg>`;
  switch (code) {
    case 'fr': return wrap(`<rect width="${w}" height="${h}" fill="#fff"/><rect width="7.33" height="${h}" fill="#0055A4"/><rect x="14.66" width="7.34" height="${h}" fill="#EF4135"/>`);
    case 'it': return wrap(`<rect width="${w}" height="${h}" fill="#fff"/><rect width="7.33" height="${h}" fill="#009246"/><rect x="14.66" width="7.34" height="${h}" fill="#CE2B37"/>`);
    case 'de': return wrap(`<rect width="${w}" height="${h}" fill="#000"/><rect y="5.33" width="${w}" height="5.34" fill="#DD0000"/><rect y="10.66" width="${w}" height="5.34" fill="#FFCE00"/>`);
    case 'ru': return wrap(`<rect width="${w}" height="${h}" fill="#fff"/><rect y="8" width="${w}" height="8" fill="#D52B1E"/><rect y="0" width="${w}" height="5.33" fill="#0039A6"/>`);
    case 'en': return wrap(`<rect width="${w}" height="${h}" fill="#012169"/>
      <path d="M0,0 L22,16 M22,0 L0,16" stroke="#fff" stroke-width="3.2"/>
      <path d="M0,0 L22,16 M22,0 L0,16" stroke="#C8102E" stroke-width="1.6"/>
      <path d="M11,0 V16 M0,8 H22" stroke="#fff" stroke-width="5"/>
      <path d="M11,0 V16 M0,8 H22" stroke="#C8102E" stroke-width="3"/>`);
  }
}

  de: ['Mathematik','Lesen','Schreiben','Naturwissenschaften','Geschichte','Erdkunde','Kunst','Musik','Sport','Deutsch','Informatik'],

};
const SLOTS = ['08:30–09:30','09:45–10:45','11:00–12:00','13:30–14:30','14:45–15:45'];

// Deterministic pseudo-random per (grade, day) so schedules are stable
function seedRand(seed) {
  let s = seed * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function buildSchedule(grade, lang) {
  const pool = SUBJECTS[lang];
  return T[lang].days.map((day, di) => {
    const rnd = seedRand(grade * 100 + di + lang.length);
    const count = 3 + Math.floor(rnd() * 2); // 3–4 lessons
    const used = new Set(); const lessons = [];
    while (lessons.length < count) {
      const idx = Math.floor(rnd() * pool.length);
      if (used.has(idx)) continue;
      used.add(idx);
      lessons.push({ name: pool[idx], time: SLOTS[lessons.length] });
    }
    return { day, lessons };
  });
}

function renderCalendar() {
  const t = T[lang];
  document.getElementById('cal-heads').innerHTML = t.calHeads.map(h=>`<div class="cal-head">${h}</div>`).join('');
  document.getElementById('current-month').textContent = `${t.months[calMonth]} ${calYear}`;

  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysPrev = new Date(calYear, calMonth, 0).getDate();
  const eventDates = new Set(events.map(e=>e.date));

  let html = '';
  for (let i = 0; i < 42; i++) {
    const dayNum = i - startOffset + 1;
    let cls = 'cal-cell', label;
    if (dayNum < 1) { label = daysPrev + dayNum; cls += ' dim'; }
    else if (dayNum > daysInMonth) { label = dayNum - daysInMonth; cls += ' dim'; }
    else {
      label = dayNum;
      const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      if (eventDates.has(iso)) cls += ' event';
      if (dayNum === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear()) cls += ' today';
    }
    html += `<div class="${cls}">${label}</div>`;
  }
  document.getElementById('cal-days').innerHTML = html;
}

function moveMonth(delta) {
  calMonth += delta;
